<script>
        // Simple script to toggle visual state of cards (simulating confirmation)
        document.querySelectorAll('.toggle-checkbox').forEach(toggle => {
            toggle.addEventListener('change', function() {
                const card = this.closest('.bg-surface-container-lowest');
                const flexCol = this.closest('.flex-1');
                
                // Remove existing status info
                const existingStatus = flexCol.querySelectorAll('.status-info');
                existingStatus.forEach(el => el.remove());

                if (this.checked) {
                    // Create confirmed status
                    const confirmedHtml = `
                        <div class="flex items-center gap-xs mt-xs text-tertiary-container status-info">
                            <span class="material-symbols-outlined text-[16px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
                            <span class="font-caption text-caption">GV. Bạn • Vừa xong</span>
                        </div>
                    `;
                    // Remove "Chưa nộp bài" if it exists
                    const pendingText = flexCol.querySelector('.text-on-surface-variant');
                    if(pendingText) pendingText.classList.add('hidden');
                    
                    flexCol.insertAdjacentHTML('beforeend', confirmedHtml);
                } else {
                     // Create pending status
                    const pendingText = flexCol.querySelector('.text-on-surface-variant');
                    if(pendingText) {
                        pendingText.classList.remove('hidden');
                    } else {
                        const pendingHtml = `<span class="font-caption text-caption text-on-surface-variant mt-xs status-info">Chưa nộp bài</span>`;
                        flexCol.insertAdjacentHTML('beforeend', pendingHtml);
                    }
                }
            });
        });
    </script>
