<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Nhập điểm mini test - MENGLISH</title>

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .form-input-focus:focus-within {
            border-color: #3B5BFB;
            box-shadow: 0 0 0 2px rgba(59, 91, 251, 0.2);
        }
    </style>
</head>
<body class="bg-background text-on-background font-body-base min-h-screen">
<main class="w-full max-w-3xl mx-auto p-lg md:p-xl">
<!-- Header -->
<header class="mb-lg">
<h1 class="font-h1 text-h1 text-on-background">Nhập điểm mini test</h1>
<p class="font-body-small text-body-small text-on-surface-variant mt-sm">Vui lòng chọn thông tin và nhập điểm cho học sinh.</p>
</header>
<!-- Main Form Content -->
<form class="bg-surface-container-lowest border border-surface-variant rounded-xl p-lg shadow-sm" id="scoreForm">
<!-- Error Banner -->
<div class="hidden bg-error-container text-on-error-container p-md rounded-lg mb-lg flex items-start gap-sm" id="errorBanner">
<span class="material-symbols-outlined text-error" data-weight="fill" style="font-variation-settings: 'FILL' 1;">error</span>
<p class="font-body-medium text-body-medium">Cần nhập đủ điểm 4 kỹ năng.</p>
</div>
<!-- Selection Section -->
<section class="grid grid-cols-1 md:grid-cols-2 gap-lg mb-xl">
<!-- Unit Selection -->
<div class="flex flex-col gap-xs">
<label class="font-body-medium text-body-medium text-on-surface-variant" for="unitSelect">Chọn Unit <span class="text-error">*</span></label>
<div class="relative form-input-focus border border-outline-variant rounded-lg bg-surface-container-lowest transition-all">
<select class="w-full font-body-base text-body-base text-on-surface bg-transparent border-none focus:ring-0 rounded-lg p-sm appearance-none outline-none" id="unitSelect" required="">
<option disabled="" selected="" value="">Chọn Unit bài học</option>
<option value="unit1">Unit 1: Introduction</option>
<option value="unit2">Unit 2: Daily Routines</option>
<option value="unit3">Unit 3: At the Restaurant</option>
<option value="unit4">Unit 4: Travel &amp; Transport</option>
</select>
<span class="material-symbols-outlined absolute right-sm top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant">expand_more</span>
</div>
</div>
<!-- Student Selection -->
<div class="flex flex-col gap-xs">
<label class="font-body-medium text-body-medium text-on-surface-variant" for="studentSelect">Chọn học sinh <span class="text-error">*</span></label>
<div class="relative form-input-focus border border-outline-variant rounded-lg bg-surface-container-lowest transition-all">
<select class="w-full font-body-base text-body-base text-on-surface bg-transparent border-none focus:ring-0 rounded-lg p-sm appearance-none outline-none" id="studentSelect" required="">
<option disabled="" selected="" value="">Chọn học sinh từ danh sách</option>
<option value="hs1">Nguyễn Văn A</option>
<option value="hs2">Trần Thị B</option>
<option value="hs3">Lê Hoàng C</option>
<option value="hs4">Phạm Đình D</option>
</select>
<span class="material-symbols-outlined absolute right-sm top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant">expand_more</span>
</div>
</div>
</section>
<hr class="border-surface-variant mb-xl"/>
<!-- Scores Section -->
<section class="mb-xl">
<h2 class="font-h3 text-h3 text-on-background mb-md">Điểm kỹ năng</h2>
<div class="grid grid-cols-1 sm:grid-cols-2 gap-md">
<!-- Listening -->
<div class="flex flex-col gap-xs">
<label class="font-body-medium text-body-medium text-on-surface-variant flex justify-between items-center" for="scoreListening">
                            Nghe <span class="text-error">*</span>
</label>
<input class="score-input font-body-base text-body-base text-on-surface border border-outline-variant rounded-lg p-sm bg-surface-container-lowest focus:outline-none focus:border-secondary focus:ring-2 focus:ring-secondary/20 transition-all" id="scoreListening" min="0" placeholder="Nhập điểm" required="" step="0.1" type="number"/>
</div>
<!-- Speaking -->
<div class="flex flex-col gap-xs">
<label class="font-body-medium text-body-medium text-on-surface-variant flex justify-between items-center" for="scoreSpeaking">
                            Nói <span class="text-error">*</span>
</label>
<input class="score-input font-body-base text-body-base text-on-surface border border-outline-variant rounded-lg p-sm bg-surface-container-lowest focus:outline-none focus:border-secondary focus:ring-2 focus:ring-secondary/20 transition-all" id="scoreSpeaking" min="0" placeholder="Nhập điểm" required="" step="0.1" type="number"/>
</div>
<!-- Reading -->
<div class="flex flex-col gap-xs">
<label class="font-body-medium text-body-medium text-on-surface-variant flex justify-between items-center" for="scoreReading">
                            Đọc <span class="text-error">*</span>
</label>
<input class="score-input font-body-base text-body-base text-on-surface border border-outline-variant rounded-lg p-sm bg-surface-container-lowest focus:outline-none focus:border-secondary focus:ring-2 focus:ring-secondary/20 transition-all" id="scoreReading" min="0" placeholder="Nhập điểm" required="" step="0.1" type="number"/>
</div>
<!-- Writing -->
<div class="flex flex-col gap-xs">
<label class="font-body-medium text-body-medium text-on-surface-variant flex justify-between items-center" for="scoreWriting">
                            Viết <span class="text-error">*</span>
</label>
<input class="score-input font-body-base text-body-base text-on-surface border border-outline-variant rounded-lg p-sm bg-surface-container-lowest focus:outline-none focus:border-secondary focus:ring-2 focus:ring-secondary/20 transition-all" id="scoreWriting" min="0" placeholder="Nhập điểm" required="" step="0.1" type="number"/>
</div>
</div>
</section>
<!-- Comments Section -->
<section class="mb-xl">
<div class="flex flex-col gap-xs">
<label class="font-body-medium text-body-medium text-on-surface-variant" for="comments">Nhận xét chung <span class="text-on-surface-variant/60 font-body-small">(Không bắt buộc)</span></label>
<textarea class="font-body-base text-body-base text-on-surface border border-outline-variant rounded-lg p-sm bg-surface-container-lowest focus:outline-none focus:border-secondary focus:ring-2 focus:ring-secondary/20 transition-all resize-none" id="comments" placeholder="Nhập nhận xét về phần làm bài của học sinh..." rows="3"></textarea>
</div>
</section>
<!-- Actions -->
<div class="flex justify-end gap-md mt-lg pt-md border-t border-surface-variant">
<button class="px-lg py-sm rounded-lg font-body-medium text-body-medium text-on-background border border-outline-variant hover:bg-surface-container-low transition-colors duration-200" type="button">
                    Hủy
                </button>
<button class="px-lg py-sm rounded-lg font-body-medium text-body-medium text-on-primary bg-primary-container hover:bg-primary transition-colors duration-200 shadow-sm hover:shadow-md flex items-center gap-xs" type="submit">
<span class="material-symbols-outlined text-[20px]" data-weight="fill">save</span>
                    Lưu điểm
                </button>
</div>
</form>
</main>
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('scoreForm');
            const errorBanner = document.getElementById('errorBanner');
            const scoreInputs = document.querySelectorAll('.score-input');
            const unitSelect = document.getElementById('unitSelect');
            const studentSelect = document.getElementById('studentSelect');

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                
                let hasError = false;
                
                // Check if all scores are filled
                scoreInputs.forEach(input => {
                    if (input.value.trim() === '') {
                        hasError = true;
                        input.classList.add('border-error', 'ring-2', 'ring-error/20');
                    } else {
                        input.classList.remove('border-error', 'ring-2', 'ring-error/20');
                    }
                });

                // Check selects
                if(unitSelect.value === '') {
                    hasError = true;
                    unitSelect.parentElement.classList.add('border-error');
                } else {
                    unitSelect.parentElement.classList.remove('border-error');
                }

                if(studentSelect.value === '') {
                    hasError = true;
                    studentSelect.parentElement.classList.add('border-error');
                } else {
                    studentSelect.parentElement.classList.remove('border-error');
                }

                if (hasError) {
                    errorBanner.classList.remove('hidden');
                    // Scroll to top to see error
                    window.scrollTo({ top: 0, behavior: 'smooth' });
                } else {
                    errorBanner.classList.add('hidden');
                    
                    // Simulate save success (replace with actual logic)
                    const saveBtn = form.querySelector('button[type="submit"]');
                    const originalText = saveBtn.innerHTML;
                    
                    saveBtn.innerHTML = `<span class="material-symbols-outlined text-[20px]">check</span> Đã lưu`;
                    saveBtn.classList.replace('bg-primary-container', 'bg-tertiary-container');
                    saveBtn.classList.add('text-on-tertiary-container');
                    
                    setTimeout(() => {
                        saveBtn.innerHTML = originalText;
                        saveBtn.classList.replace('bg-tertiary-container', 'bg-primary-container');
                        saveBtn.classList.remove('text-on-tertiary-container');
                        // Optionally reset form
                        // form.reset(); 
                    }, 2000);
                }
            });

            // Clear error styling on input change
            scoreInputs.forEach(input => {
                input.addEventListener('input', () => {
                    input.classList.remove('border-error', 'ring-2', 'ring-error/20');
                    // Hide general error if all fields have some value
                    if([...scoreInputs].every(inp => inp.value.trim() !== '')) {
                         errorBanner.classList.add('hidden');
                    }
                });
            });
            
            [unitSelect, studentSelect].forEach(select => {
                 select.addEventListener('change', () => {
                    select.parentElement.classList.remove('border-error');
                 });
            });
        });
    </script>
</body></html>
