<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Báo cáo quý — Học thuật</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "on-surface": "#161c27",
                        "surface-container-low": "#f1f3ff",
                        "primary-fixed": "#ffdbcd",
                        "primary-fixed-dim": "#ffb595",
                        "on-tertiary-container": "#0e3500",
                        "tertiary-fixed-dim": "#78de4b",
                        "surface-container-high": "#e3e8f9",
                        "surface": "#f9f9ff",
                        "secondary-fixed": "#dee0ff",
                        "on-tertiary-fixed-variant": "#1a5200",
                        "inverse-primary": "#ffb595",
                        "secondary-container": "#4160ff",
                        "tertiary": "#256d00",
                        "on-secondary-fixed": "#00105b",
                        "on-secondary-fixed-variant": "#002fc9",
                        "surface-container-lowest": "#ffffff",
                        "inverse-on-surface": "#ecf0ff",
                        "on-primary": "#ffffff",
                        "on-surface-variant": "#594137",
                        "surface-container-highest": "#dde2f3",
                        "on-error": "#ffffff",
                        "surface-dim": "#d4daea",
                        "secondary": "#1e43e7",
                        "surface-container": "#e8eeff",
                        "error-container": "#ffdad6",
                        "on-secondary-container": "#faf7ff",
                        "error": "#ba1a1a",
                        "secondary-fixed-dim": "#bac3ff",
                        "on-primary-fixed-variant": "#7c2e00",
                        "on-tertiary": "#ffffff",
                        "on-primary-container": "#521c00",
                        "surface-bright": "#f9f9ff",
                        "surface-tint": "#a23f00",
                        "on-error-container": "#93000a",
                        "on-primary-fixed": "#360f00",
                        "surface-variant": "#dde2f3",
                        "on-background": "#161c27",
                        "outline": "#8d7165",
                        "primary-container": "#f5691a",
                        "tertiary-fixed": "#93fb65",
                        "on-tertiary-fixed": "#062100",
                        "inverse-surface": "#2a303d",
                        "on-secondary": "#ffffff",
                        "outline-variant": "#e1bfb2",
                        "primary": "#a23f00",
                        "tertiary-container": "#46a917",
                        "background": "#f9f9ff"
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    spacing: {
                        "xl": "32px",
                        "lg": "24px",
                        "base": "8px",
                        "header-height": "64px",
                        "sm": "8px",
                        "md": "16px",
                        "sidebar-width": "260px",
                        "xs": "4px",
                        "gutter": "16px"
                    },
                    fontFamily: {
                        "label": ["Be Vietnam Pro"],
                        "body-medium": ["Be Vietnam Pro"],
                        "body-base": ["Be Vietnam Pro"],
                        "caption": ["Be Vietnam Pro"],
                        "body-small": ["Be Vietnam Pro"],
                        "h1": ["Be Vietnam Pro"],
                        "h3": ["Be Vietnam Pro"],
                        "h2": ["Be Vietnam Pro"],
                        "code": ["JetBrains Mono"]
                    },
                    fontSize: {
                        "label": ["11px", { lineHeight: "16px", letterSpacing: "0.05em", fontWeight: "600" }],
                        "body-medium": ["14px", { lineHeight: "20px", fontWeight: "500" }],
                        "body-base": ["14px", { lineHeight: "20px", fontWeight: "400" }],
                        "caption": ["11px", { lineHeight: "16px", fontWeight: "400" }],
                        "body-small": ["13px", { lineHeight: "18px", fontWeight: "400" }],
                        "h1": ["28px", { lineHeight: "36px", letterSpacing: "-0.02em", fontWeight: "700" }],
                        "h3": ["18px", { lineHeight: "26px", fontWeight: "600" }],
                        "h2": ["22px", { lineHeight: "30px", letterSpacing: "-0.01em", fontWeight: "600" }],
                        "code": ["13px", { lineHeight: "18px", fontWeight: "400" }]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Be Vietnam Pro', sans-serif; background-color: #f9f9ff; color: #161c27; }
        .input-glow:focus { border-color: #1e43e7; box-shadow: 0 0 0 2px rgba(30, 67, 231, 0.2); outline: none; }
    </style>
</head>
<body class="bg-background min-h-screen p-lg lg:p-xl flex justify-center">
<div class="max-w-[1200px] w-full flex flex-col gap-lg">
<!-- Header Section -->
<header class="flex flex-col md:flex-row md:items-end justify-between gap-md border-b border-surface-container-highest pb-lg">
<div>
<h1 class="text-h1 font-h1 text-on-surface mb-xs">Báo cáo quý — Học thuật</h1>
<p class="text-body-medium font-body-medium text-on-surface-variant">Hệ thống Quản trị Học thuật</p>
</div>
<div class="flex items-center gap-md bg-surface-container-lowest p-md rounded-lg border border-surface-container-highest">
<div class="flex flex-col gap-xs">
<label class="text-label font-label text-on-surface-variant uppercase" for="startMonth">Tháng bắt đầu</label>
<select class="text-body-medium font-body-medium bg-surface-bright border border-surface-container-highest rounded px-sm py-xs input-glow" id="startMonth">
<option value="1">Tháng 1</option>
<option value="4">Tháng 4</option>
<option selected="" value="7">Tháng 7</option>
<option value="10">Tháng 10</option>
</select>
</div>
<div class="h-full w-px bg-surface-container-highest mx-xs"></div>
<div class="flex flex-col gap-xs">
<span class="text-label font-label text-on-surface-variant uppercase">Kỳ báo cáo</span>
<span class="text-body-medium font-body-medium text-on-surface font-semibold" id="reportPeriodText">Tháng 7 - Tháng 9 / Năm 2024</span>
</div>
</div>
</header>
<!-- Main Layout: Split Content & Sidebar -->
<div class="flex flex-col lg:flex-row gap-xl w-full">
<!-- Left Area: Narrative Entry (Main Content) -->
<main class="flex-1 flex flex-col gap-lg w-full min-w-0">
<section class="bg-surface-container-lowest rounded-lg border border-surface-container-highest p-lg shadow-sm">
<h2 class="text-h2 font-h2 text-on-surface mb-md">Nội dung báo cáo</h2>
<div class="flex flex-col gap-md">
<!-- Textarea 1 -->
<div class="flex flex-col gap-xs">
<label class="text-body-small font-body-small text-on-surface-variant" for="academicWork">Công việc học thuật</label>
<textarea class="w-full text-body-base font-body-base border border-surface-container-highest rounded-md p-md bg-surface-bright input-glow resize-y min-h-[100px]" id="academicWork" placeholder="Nhập chi tiết các hoạt động học thuật đã triển khai trong quý..." rows="4"></textarea>
</div>
<!-- Textarea 2 -->
<div class="flex flex-col gap-xs">
<label class="text-body-small font-body-small text-on-surface-variant" for="teacherStaff">Nhân sự giáo viên</label>
<textarea class="w-full text-body-base font-body-base border border-surface-container-highest rounded-md p-md bg-surface-bright input-glow resize-y min-h-[100px]" id="teacherStaff" placeholder="Nhập tình hình nhân sự, tuyển dụng, đào tạo giáo viên..." rows="4"></textarea>
</div>
<!-- Textarea 3 -->
<div class="flex flex-col gap-xs">
<label class="text-body-small font-body-small text-on-surface-variant" for="nextTermPlan">Kế hoạch công việc kỳ sau</label>
<textarea class="w-full text-body-base font-body-base border border-surface-container-highest rounded-md p-md bg-surface-bright input-glow resize-y min-h-[100px]" id="nextTermPlan" placeholder="Định hướng và mục tiêu công việc cho quý tiếp theo..." rows="4"></textarea>
</div>
</div>
</section>
<section class="bg-surface-container-lowest rounded-lg border border-surface-container-highest p-lg shadow-sm">
<h2 class="text-h3 font-h3 text-on-surface mb-md border-b border-surface-container-highest pb-sm">Đánh giá chung</h2>
<div class="grid grid-cols-1 md:grid-cols-3 gap-md">
<div class="flex flex-col gap-xs">
<label class="text-body-small font-body-small text-on-surface-variant" for="programProgress">Tiến độ chương trình</label>
<textarea class="w-full text-body-base font-body-base border border-surface-container-highest rounded-md p-sm bg-surface-bright input-glow resize-y" id="programProgress" placeholder="Đánh giá tiến độ..." rows="3"></textarea>
</div>
<div class="flex flex-col gap-xs">
<label class="text-body-small font-body-small text-on-surface-variant" for="implementationQuality">Chất lượng triển khai</label>
<textarea class="w-full text-body-base font-body-base border border-surface-container-highest rounded-md p-sm bg-surface-bright input-glow resize-y" id="implementationQuality" placeholder="Đánh giá chất lượng..." rows="3"></textarea>
</div>
<div class="flex flex-col gap-xs">
<label class="text-body-small font-body-small text-on-surface-variant" for="improvementPriority">Ưu tiên cải thiện</label>
<textarea class="w-full text-body-base font-body-base border border-surface-container-highest rounded-md p-sm bg-surface-bright input-glow resize-y" id="improvementPriority" placeholder="Các điểm cần khắc phục..." rows="3"></textarea>
</div>
</div>
</section>
</main>
<!-- Right Area: Automated Rollups (Sidebar) -->
<aside class="w-full lg:w-[320px] flex-shrink-0 flex flex-col gap-lg">
<div class="bg-surface-container-lowest rounded-lg border border-surface-container-highest shadow-sm overflow-hidden sticky top-lg">
<div class="bg-surface-container-low px-md py-sm border-b border-surface-container-highest">
<h3 class="text-h3 font-h3 text-on-surface">Danh sách báo cáo tháng trong kỳ</h3>
</div>
<div class="flex flex-col">
<!-- Report Item 1 -->
<div class="flex items-center justify-between px-md py-md border-b border-surface-container-highest hover:bg-surface-bright transition-colors group">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-secondary text-[20px]">description</span>
<span class="text-body-medium font-body-medium text-on-surface">Báo cáo Tháng 7</span>
</div>
<button class="text-body-small font-body-small text-secondary font-medium opacity-0 group-hover:opacity-100 transition-opacity flex items-center gap-xs">
                                Xem <span class="material-symbols-outlined text-[16px]">arrow_forward</span>
</button>
</div>
<!-- Report Item 2 -->
<div class="flex items-center justify-between px-md py-md border-b border-surface-container-highest hover:bg-surface-bright transition-colors group">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-secondary text-[20px]">description</span>
<span class="text-body-medium font-body-medium text-on-surface">Báo cáo Tháng 8</span>
</div>
<button class="text-body-small font-body-small text-secondary font-medium opacity-0 group-hover:opacity-100 transition-opacity flex items-center gap-xs">
                                Xem <span class="material-symbols-outlined text-[16px]">arrow_forward</span>
</button>
</div>
<!-- Report Item 3 -->
<div class="flex items-center justify-between px-md py-md hover:bg-surface-bright transition-colors group">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-secondary text-[20px]">description</span>
<span class="text-body-medium font-body-medium text-on-surface">Báo cáo Tháng 9</span>
</div>
<button class="text-body-small font-body-small text-secondary font-medium opacity-0 group-hover:opacity-100 transition-opacity flex items-center gap-xs">
                                Xem <span class="material-symbols-outlined text-[16px]">arrow_forward</span>
</button>
</div>
</div>
</div>
</aside>
</div>
<!-- Footer Actions -->
<footer class="flex justify-end pt-lg border-t border-surface-container-highest mt-md pb-xl">
<button class="bg-primary-container text-on-primary font-h3 text-h3 px-xl py-sm rounded-md shadow-sm hover:shadow-md hover:opacity-90 transition-all flex items-center gap-sm">
<span class="material-symbols-outlined text-[20px]">save</span>
                Lưu phần tường thuật
            </button>
</footer>
</div>
<script>
        // Simple logic for Report Period label
        document.getElementById('startMonth').addEventListener('change', function(e) {
            const startMonth = parseInt(e.target.value);
            const endMonth = startMonth + 2;
            const currentYear = new Date().getFullYear();
            
            const label = document.getElementById('reportPeriodText');
            label.textContent = `Tháng ${startMonth} - Tháng ${endMonth} / Năm ${currentYear}`;
            
            // Also update the sidebar list for demo purposes
            const sidebarItems = document.querySelectorAll('aside .flex-col > div');
            if(sidebarItems.length >= 3) {
                sidebarItems[0].querySelector('.text-on-surface').textContent = `Báo cáo Tháng ${startMonth}`;
                sidebarItems[1].querySelector('.text-on-surface').textContent = `Báo cáo Tháng ${startMonth + 1}`;
                sidebarItems[2].querySelector('.text-on-surface').textContent = `Báo cáo Tháng ${endMonth}`;
            }
        });
    </script>
</body></html>
