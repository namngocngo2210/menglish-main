<style>
        /* Custom scrollbar for textareas */
        textarea::-webkit-scrollbar {
            width: 6px;
        }
        textarea::-webkit-scrollbar-track {
            background: transparent;
        }
        textarea::-webkit-scrollbar-thumb {
            background-color: #d4daea;
            border-radius: 10px;
        }
        /* Toast animation */
        @keyframes slideUpFade {
            0% { opacity: 0; transform: translateY(20px) translateX(-50%); }
            10% { opacity: 1; transform: translateY(0) translateX(-50%); }
            90% { opacity: 1; transform: translateY(0) translateX(-50%); }
            100% { opacity: 0; transform: translateY(20px) translateX(-50%); }
        }
        .toast-animate {
            animation: slideUpFade 3s ease-in-out forwards;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background text-on-background font-body-base antialiased min-h-screen pb-20">
<!-- Main Content Container for Mobile -->
<main class="w-full max-w-md mx-auto p-md space-y-lg pt-lg">
<!-- Header Context (Optional, for clarity even without TopAppBar) -->
<header class="mb-lg">
<h1 class="font-h1 text-h1 text-on-surface">Khảo sát &amp; Đánh giá</h1>
<p class="font-body-base text-body-base text-on-surface-variant mt-xs">Hãy chia sẻ ý kiến của bạn để chúng tôi nâng cao chất lượng dịch vụ.</p>
</header>
<!-- Section 1: Open Surveys List -->
<section class="space-y-sm" id="survey-list">
<h2 class="font-h3 text-h3 text-on-surface mb-sm">Khảo sát đang mở</h2>
<!-- Survey Card 1 (Active/Selected) -->
<button class="w-full text-left bg-surface-container-lowest border border-primary-container rounded-lg p-md shadow-sm transition-all relative overflow-hidden group" onclick="selectSurvey(1)">
<div class="absolute left-0 top-0 bottom-0 w-1 bg-primary-container rounded-l-lg"></div>
<div class="flex justify-between items-start">
<div class="pr-md">
<h3 class="font-body-medium text-body-medium text-on-surface mb-xs">Đánh giá chất lượng cơ sở vật chất tháng 10</h3>
<p class="font-caption text-caption text-on-surface-variant flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">event</span>
                            Hạn: 30/10/2023
                        </p>
</div>
<span class="material-symbols-outlined text-primary-container">radio_button_checked</span>
</div>
</button>
<!-- Survey Card 2 -->
<button class="w-full text-left bg-surface-container-lowest border border-outline-variant rounded-lg p-md transition-all hover:bg-surface-container-low group" onclick="selectSurvey(2)">
<div class="flex justify-between items-start">
<div class="pr-md">
<h3 class="font-body-medium text-body-medium text-on-surface mb-xs">Khảo sát mức độ hài lòng về giáo trình IELTS Starter</h3>
<p class="font-caption text-caption text-error flex items-center gap-1">
<span class="material-symbols-outlined text-[14px]">event</span>
                            Hạn: Hôm nay
                        </p>
</div>
<span class="material-symbols-outlined text-outline">radio_button_unchecked</span>
</div>
</button>
</section>
<!-- Section 2: Feedback Form -->
<section class="bg-surface-container-lowest border border-outline-variant rounded-xl p-md shadow-sm mt-lg" id="feedback-form-section">
<h2 class="font-h3 text-h3 text-on-surface mb-sm">Nội dung phản hồi</h2>
<p class="font-body-small text-body-small text-on-surface-variant mb-md">Đang phản hồi cho: <span class="font-body-medium text-body-medium text-on-surface">Đánh giá chất lượng cơ sở vật chất tháng 10</span></p>
<form class="space-y-md" id="survey-form" onsubmit="submitSurvey(event)">
<div>
<label class="block font-label text-label text-on-surface-variant mb-xs" for="feedback">Ý KIẾN CỦA BẠN <span class="text-error">*</span></label>
<textarea class="w-full bg-surface border border-outline-variant rounded-lg p-sm font-body-base text-body-base text-on-surface focus:border-secondary focus:ring-1 focus:ring-secondary focus:outline-none resize-none transition-shadow" id="feedback" name="feedback" placeholder="Vui lòng nhập chi tiết phản hồi của bạn tại đây..." required="" rows="5"></textarea>
</div>
<button class="w-full bg-primary-container text-on-primary font-body-medium text-body-medium py-sm px-md rounded-lg flex items-center justify-center gap-2 hover:opacity-90 active:scale-[0.98] transition-all" type="submit">
<span class="material-symbols-outlined text-[20px]">send</span>
                    Gửi phản hồi
                </button>
</form>
</section>
</main>
<!-- Toast Notification (Hidden by default) -->
<div class="fixed bottom-24 left-1/2 transform -translate-x-1/2 z-50 hidden" id="toast">
<div class="bg-tertiary-container text-on-tertiary px-lg py-sm rounded-full shadow-lg flex items-center gap-sm font-body-medium text-body-medium whitespace-nowrap">
<span class="material-symbols-outlined text-[20px]">check_circle</span>
            Cảm ơn bạn đã gửi khảo sát!
        </div>
</div>
<script>
        function selectSurvey(id) {
            // In a real app, this would update the UI to show which survey is selected
            // and update the form context. For this mockup, we just scroll to form.
            document.getElementById('feedback').focus();
        }

        function submitSurvey(event) {
            event.preventDefault();
            
            const textarea = document.getElementById('feedback');
            const submitBtn = event.target.querySelector('button[type="submit"]');
            const toast = document.getElementById('toast');
            
            if (textarea.value.trim() === '') return;

            // Simulate loading state
            const originalBtnText = submitBtn.innerHTML;
            submitBtn.innerHTML = '<span class="material-symbols-outlined text-[20px] animate-spin">sync</span> Đang gửi...';
            submitBtn.disabled = true;
            submitBtn.classList.add('opacity-70');

            setTimeout(() => {
                // Reset form
                textarea.value = '';
                submitBtn.innerHTML = originalBtnText;
                submitBtn.disabled = false;
                submitBtn.classList.remove('opacity-70');

                // Show toast
                toast.classList.remove('hidden');
                toast.classList.add('toast-animate');

                // Hide toast after animation completes
                setTimeout(() => {
                    toast.classList.add('hidden');
                    toast.classList.remove('toast-animate');
                }, 3000);
            }, 800); // Simulated network delay
        }
    </script>
