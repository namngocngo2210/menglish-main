# Một file cho cả production và staging: mỗi môi trường là một project riêng (DB, volume, scheduler riêng).
# Chạy qua script: docker/menglish.sh <production|staging> <lệnh compose>   — xem docs/deploy-docker.md
name: menglish-${DEPLOY_ENV:?đặt DEPLOY_ENV trong .env.<môi trường>}

x-app: &app
  image: menglish-app:${DEPLOY_ENV}
  restart: unless-stopped
  env_file: .env.${DEPLOY_ENV}
  environment: &app-env
    DB_HOST: db
    DB_PORT: 3306
    # Chỉ nhận request qua proxy Caddy (app không mở cổng ra ngoài)
    TRUSTED_PROXIES: "*"
    PHP_OPCACHE_ENABLE: 1
    PHP_POST_MAX_SIZE: 100M
    PHP_UPLOAD_MAX_FILE_SIZE: 100M
    # Job hàng đợi chạy tới 900 giây (import đề cố định): retry_after phải lớn hơn để job không bị lấy chạy lần hai
    DB_QUEUE_RETRY_AFTER: 960
  volumes:
    - storage:/var/www/html/storage
    - uploads:/var/www/html/public/uploads
  depends_on:
    db:
      condition: service_healthy

services:
  app:
    <<: *app
    build: .
    environment:
      <<: *app-env
      # Cache config/route/view + storage:link khi khởi động. Không tự migrate: chạy tay (docker/menglish.sh <env> migrate).
      AUTORUN_ENABLED: "true"
      AUTORUN_LARAVEL_MIGRATION: "false"
    networks:
      default:
      proxy:
        aliases: ["menglish-${DEPLOY_ENV}"]

  scheduler:
    <<: *app
    pull_policy: never
    command: ["php", "/var/www/html/artisan", "schedule:work"]
    stop_signal: SIGTERM
    healthcheck:
      test: ["CMD", "healthcheck-schedule"]
      start_period: 10s

  # Xử lý job hàng đợi việc nặng (import, tính lương...) ở queue default. Code mới chỉ có hiệu lực sau khi restart (deploy tự làm).
  queue:
    <<: *app
    pull_policy: never
    command: ["php", "/var/www/html/artisan", "queue:work", "--tries=1", "--timeout=900", "--memory=512", "--max-time=3600"]
    stop_signal: SIGTERM
    environment:
      <<: *app-env
      PHP_MEMORY_LIMIT: 1G
    healthcheck:
      test: ["CMD", "healthcheck-queue"]
      start_period: 10s

  # Email thông báo (queue notifications) chạy worker riêng: một lần import dài ở queue default không làm email chờ theo.
  # Số lần thử lại đặt trong từng job (SendHtmlMail, SendParentNotice), --tries chỉ là mặc định.
  queue-notifications:
    <<: *app
    pull_policy: never
    command: ["php", "/var/www/html/artisan", "queue:work", "--queue=notifications", "--tries=1", "--timeout=120", "--memory=256", "--max-time=3600"]
    stop_signal: SIGTERM
    healthcheck:
      test: ["CMD", "healthcheck-queue"]
      start_period: 10s

  db:
    image: mariadb:11.4
    restart: unless-stopped
    environment:
      MARIADB_DATABASE: ${DB_DATABASE}
      MARIADB_USER: ${DB_USERNAME}
      MARIADB_PASSWORD: ${DB_PASSWORD}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      TZ: Asia/Ho_Chi_Minh
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--max-allowed-packet=256M"]
    volumes:
      - db:/var/lib/mysql
    # Chỉ mở cho máy chủ (SSH tunnel / công cụ quản trị), không ra Internet.
    ports:
      - "127.0.0.1:${DB_FORWARD_PORT}:3306"
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10

networks:
  proxy:
    name: menglish-proxy
    external: true

volumes:
  db:
  storage:
  uploads:
