<style>
        body { font-family: 'Be Vietnam Pro', sans-serif; background-color: #f9f9ff; }
        .material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24; }

        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    </style>

<body class="bg-background text-on-background antialiased pb-24">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface dark:bg-surface border-b border-surface-container dark:border-surface-container-high flat no shadows flex items-center justify-between px-md h-header-height w-full">
<div class="flex items-center gap-4">
<button class="text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-container-high transition-colors active:scale-95 duration-150 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="font-h2 text-[20px] md:text-h2 font-bold text-primary dark:text-primary-fixed">Nộp báo cáo trực lớp</h1>
</div>
<button class="text-on-surface-variant dark:text-on-surface-variant hover:bg-surface-container-high transition-colors active:scale-95 duration-150 p-2 rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="more_vert">more_vert</span>
</button>
</header>
<!-- Main Content -->
<main class="pt-20 px-4 md:px-6 max-w-3xl mx-auto flex flex-col gap-6">
<!-- Thông tin lớp -->
<section class="bg-surface-container-lowest border border-surface-container-highest rounded-lg p-4 flex flex-col gap-2 shadow-sm">
<div class="flex items-start gap-3">
<div class="w-10 h-10 rounded-full bg-primary-container/10 flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-primary-container fill" data-icon="class">class</span>
</div>
<div class="flex flex-col">
<span class="font-caption text-caption text-on-surface-variant uppercase">Lớp học</span>
<span class="font-body-medium text-body-medium text-on-surface">IELTS Foundation - Tối T3/T5</span>
</div>
</div>
<div class="w-full h-px bg-surface-container-highest my-1"></div>
<div class="flex items-start gap-3">
<div class="w-10 h-10 rounded-full bg-secondary-container/10 flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-secondary-container fill" data-icon="event_note">event_note</span>
</div>
<div class="flex flex-col">
<span class="font-caption text-caption text-on-surface-variant uppercase">Buổi học</span>
<span class="font-body-medium text-body-medium text-on-surface">Buổi 5 - Listening Practice</span>
</div>
</div>
</section>
<!-- Form nội dung -->
<section class="flex flex-col gap-4">
<div class="flex flex-col gap-1.5">
<label class="font-body-small text-body-small text-on-surface font-medium flex items-center gap-1" for="hom_nay_hoc_gi">
                    Hôm nay học gì <span class="text-error">*</span>
</label>
<textarea class="w-full bg-surface-container-lowest border border-surface-container-highest rounded-md px-3 py-2 font-body-base text-body-base focus:border-secondary focus:ring-1 focus:ring-secondary/20 outline-none transition-all placeholder:text-on-surface-variant/50" id="hom_nay_hoc_gi" placeholder="Tóm tắt nội dung chính đã giảng dạy..." rows="3"></textarea>
</div>
<div class="flex flex-col gap-1.5">
<label class="font-body-small text-body-small text-on-surface font-medium flex items-center gap-1" for="nhat_ky_day">
                    Nhật ký dạy <span class="text-on-surface-variant font-normal text-xs">(Tùy chọn)</span>
</label>
<textarea class="w-full bg-surface-container-lowest border border-surface-container-highest rounded-md px-3 py-2 font-body-base text-body-base focus:border-secondary focus:ring-1 focus:ring-secondary/20 outline-none transition-all placeholder:text-on-surface-variant/50" id="nhat_ky_day" placeholder="Ghi chú về thái độ học tập, vấn đề phát sinh..." rows="3"></textarea>
</div>
</section>
<!-- Đính kèm hình ảnh -->
<section class="flex flex-col gap-2">
<span class="font-body-small text-body-small text-on-surface font-medium">Đính kèm hình ảnh bảng/lớp</span>
<div class="grid grid-cols-3 sm:grid-cols-4 md:grid-cols-5 gap-3">
<button class="aspect-square bg-surface-container rounded-lg border border-dashed border-outline-variant flex flex-col items-center justify-center gap-1 hover:bg-surface-variant transition-colors active:scale-95 text-on-surface-variant">
<span class="material-symbols-outlined" data-icon="add_a_photo">add_a_photo</span>
<span class="font-caption text-[10px]">Thêm ảnh</span>
</button>
<!-- Placeholder for uploaded image -->
<div class="aspect-square bg-surface-container rounded-lg border border-surface-container-highest relative group overflow-hidden">
<div class="bg-cover bg-center w-full h-full" data-alt="A brightly lit, modern classroom whiteboard filled with detailed, legible handwritten notes in Vietnamese and English, focusing on IELTS listening strategies. The lighting is crisp, overhead fluorescent, casting no harsh shadows. The whiteboard is the main subject, framed slightly off-center, conveying a busy but organized academic environment in a corporate modern style." style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuBFTD6fQIxADmocyShINzv7KOvb1ALGY2F9dnYVLI_AbBW4j1OKmBf7HfSRv19dwBM0abWYiceEHVvf0gPRhoqnB6jRDu7HStZDfzN8TKNInOyAT-AFeu1ZOVlMCaY9fdnRfzCA9AhhED_Smh7D5UAhokik0gKxP1wLGBosGhIfH0QrFlNmLmhB3dpL2P_l-n3s0FgJvl5VRi3bG6Cp8bO8BUGJ9mEpFk_AuJPJFg-9vQx6xClOlRn8')"></div>
<button class="absolute top-1 right-1 w-6 h-6 bg-inverse-surface/80 text-inverse-on-surface rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-[14px]" data-icon="close">close</span>
</button>
</div>
</div>
</section>
<!-- Học sinh cần bổ trợ -->
<section class="flex flex-col gap-4 mt-2">
<div class="flex items-center justify-between border-b border-surface-container-high pb-2">
<h2 class="font-h3 text-h3 text-on-surface flex items-center gap-2">
<span class="material-symbols-outlined text-error" data-icon="warning">warning</span>
                    Học sinh cần bổ trợ
                </h2>
</div>
<!-- Student Support Card (Example) -->
<div class="bg-surface-container-lowest border border-surface-container-highest rounded-lg p-4 relative flex flex-col gap-4 shadow-sm group">
<button class="absolute top-3 right-3 text-on-surface-variant hover:text-error transition-colors p-1" title="Xóa dòng">
<span class="material-symbols-outlined text-xl" data-icon="delete">delete</span>
</button>
<div class="grid grid-cols-1 sm:grid-cols-2 gap-4 pr-8">
<div class="flex flex-col gap-1.5">
<label class="font-caption text-caption text-on-surface-variant">Học sinh</label>
<select class="w-full bg-surface border border-surface-container-highest rounded-md px-3 py-2 font-body-base text-body-base focus:border-secondary focus:ring-1 focus:ring-secondary/20 outline-none appearance-none">
<option>Nguyễn Văn A</option>
<option>Trần Thị B</option>
<option>Lê Văn C</option>
</select>
</div>
<div class="flex flex-col gap-1.5">
<label class="font-caption text-caption text-on-surface-variant">Buổi vắng (Tùy chọn)</label>
<select class="w-full bg-surface border border-surface-container-highest rounded-md px-3 py-2 font-body-base text-body-base focus:border-secondary focus:ring-1 focus:ring-secondary/20 outline-none appearance-none">
<option value="">-- Chọn buổi vắng --</option>
<option value="4">Buổi 4 - Reading</option>
<option selected="" value="3">Buổi 3 - Speaking</option>
</select>
</div>
</div>
<div class="flex flex-col gap-1.5 pr-8 sm:pr-0">
<label class="font-caption text-caption text-on-surface-variant flex items-center gap-1">Lý do <span class="text-error">*</span></label>
<textarea class="w-full bg-surface border border-surface-container-highest rounded-md px-3 py-2 font-body-base text-body-base focus:border-secondary focus:ring-1 focus:ring-secondary/20 outline-none placeholder:text-on-surface-variant/50" placeholder="Mô tả lý do cần bổ trợ..." rows="2">Học sinh yếu kỹ năng nghe, không theo kịp tiến độ trên lớp.</textarea>
</div>
<div class="flex flex-col gap-1.5 pr-8 sm:pr-0">
<label class="font-caption text-caption text-on-surface-variant">Kế hoạch xử lý</label>
<textarea class="w-full bg-surface-container-low border border-secondary-fixed rounded-md px-3 py-2 font-body-base text-body-base focus:border-secondary focus:ring-1 focus:ring-secondary/20 outline-none text-secondary" placeholder="Nhập kế hoạch xử lý..." rows="2">Làm lại bài tập nghe Part 1 trang 12 và ghi âm gửi TA.</textarea>
</div>
</div>
<button class="w-full py-3 border border-dashed border-primary-container text-primary-container font-body-medium text-body-medium rounded-lg flex items-center justify-center gap-2 hover:bg-primary-container/5 transition-colors active:scale-[0.98]">
<span class="material-symbols-outlined" data-icon="add">add</span>
                Thêm học sinh cần bổ trợ
            </button>
</section>
</main>
<!-- Footer Actions -->
<div class="fixed bottom-0 left-0 w-full bg-surface-container-lowest border-t border-surface-container-high p-4 flex flex-col gap-2 z-40 pb-safe pb-8 shadow-[0_-4px_12px_rgba(0,0,0,0.05)]">
<div class="max-w-3xl mx-auto w-full flex flex-col gap-2">
<button class="w-full bg-primary-container text-on-error font-body-medium text-[16px] py-3.5 rounded-lg flex items-center justify-center gap-2 hover:bg-primary-container/90 active:scale-[0.98] transition-all shadow-sm">
<span class="material-symbols-outlined" data-icon="send">send</span>
                Nộp báo cáo
            </button>
<p class="font-caption text-[12px] text-center text-on-surface-variant px-4">
<span class="font-medium text-tertiary-container">Có ảnh đính kèm</span> → hoàn thành ngay. <span class="font-medium text-error">Không có ảnh</span> → chờ GV chính xác nhận.
            </p>
</div>
</div>
</body></html>
