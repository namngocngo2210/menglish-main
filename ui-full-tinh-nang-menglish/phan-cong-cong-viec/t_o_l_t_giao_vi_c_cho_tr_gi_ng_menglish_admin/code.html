<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>EduTask Admin - Tạo lượt giao việc cho Trợ giảng</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-tint": "#a23f00",
                        "on-tertiary-container": "#0e3500",
                        "inverse-on-surface": "#ecf0ff",
                        "on-secondary-container": "#faf7ff",
                        "tertiary": "#256d00",
                        "primary": "#a23f00",
                        "background": "#f9f9ff",
                        "outline": "#8d7165",
                        "inverse-primary": "#ffb595",
                        "surface-container-low": "#f1f3ff",
                        "on-surface-variant": "#594137",
                        "on-tertiary-fixed": "#062100",
                        "secondary": "#1e43e7",
                        "on-primary-container": "#521c00",
                        "surface-container": "#e8eeff",
                        "error-container": "#ffdad6",
                        "on-background": "#161c27",
                        "on-secondary": "#ffffff",
                        "on-tertiary": "#ffffff",
                        "on-error-container": "#93000a",
                        "tertiary-container": "#46a917",
                        "on-tertiary-fixed-variant": "#1a5200",
                        "surface-container-highest": "#dde2f3",
                        "on-secondary-fixed-variant": "#002fc9",
                        "surface-bright": "#f9f9ff",
                        "surface-container-lowest": "#ffffff",
                        "secondary-fixed": "#dee0ff",
                        "error": "#ba1a1a",
                        "primary-fixed": "#ffdbcd",
                        "tertiary-fixed": "#93fb65",
                        "on-primary-fixed": "#360f00",
                        "on-surface": "#161c27",
                        "on-secondary-fixed": "#00105b",
                        "surface-container-high": "#e3e8f9",
                        "secondary-fixed-dim": "#bac3ff",
                        "tertiary-fixed-dim": "#78de4b",
                        "on-primary-fixed-variant": "#7c2e00",
                        "surface-dim": "#d4daea",
                        "outline-variant": "#e1bfb2",
                        "primary-container": "#f5691a",
                        "on-error": "#ffffff",
                        "surface-variant": "#dde2f3",
                        "primary-fixed-dim": "#ffb595",
                        "surface": "#f9f9ff",
                        "on-primary": "#ffffff",
                        "secondary-container": "#4160ff",
                        "inverse-surface": "#2a303d"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "sm": "8px",
                        "gutter": "16px",
                        "md": "16px",
                        "sidebar-width": "260px",
                        "header-height": "64px",
                        "base": "8px",
                        "lg": "24px",
                        "xs": "4px",
                        "xl": "32px"
                    },
                    "fontFamily": {
                        "h2": ["Be Vietnam Pro"],
                        "h1": ["Be Vietnam Pro"],
                        "label": ["Be Vietnam Pro"],
                        "caption": ["Be Vietnam Pro"],
                        "body-base": ["Be Vietnam Pro"],
                        "h3": ["Be Vietnam Pro"],
                        "body-medium": ["Be Vietnam Pro"],
                        "body-small": ["Be Vietnam Pro"],
                        "code": ["JetBrains Mono"]
                    },
                    "fontSize": {
                        "h2": ["22px", { "lineHeight": "30px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "h1": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "label": ["11px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "caption": ["11px", { "lineHeight": "16px", "fontWeight": "400" }],
                        "body-base": ["14px", { "lineHeight": "20px", "fontWeight": "400" }],
                        "h3": ["18px", { "lineHeight": "26px", "fontWeight": "600" }],
                        "body-medium": ["14px", { "lineHeight": "20px", "fontWeight": "500" }],
                        "body-small": ["13px", { "lineHeight": "18px", "fontWeight": "400" }],
                        "code": ["13px", { "lineHeight": "18px", "fontWeight": "400" }]
                    }
                }
            }
        }
    </script>
<style>
        body { font-family: 'Be Vietnam Pro', sans-serif; background-color: #f9f9ff; color: #161c27; }
        .toggle-checkbox:checked { right: 0; border-color: #f5691a; }
        .toggle-checkbox:checked + .toggle-label { background-color: #f5691a; }
    </style>
</head>
<body class="bg-background min-h-screen">
<div class="p-lg lg:p-xl max-w-7xl mx-auto w-full">
<!-- Header -->
<div class="mb-lg">
<h1 class="font-h1 text-h1 text-on-surface">Tạo lượt giao việc cho Trợ giảng</h1>
<p class="font-body-base text-body-base text-on-surface-variant mt-sm">Phân công nhiệm vụ chi tiết theo ngày và ca học.</p>
</div>
<div class="bg-surface-container-lowest border border-surface-variant rounded-xl p-lg shadow-sm">
<!-- Selection Section -->
<div class="grid grid-cols-1 md:grid-cols-3 gap-md mb-xl">
<!-- Select TA -->
<div>
<label class="block font-label text-label text-on-surface-variant uppercase mb-xs" for="ta-select">Chọn Trợ giảng</label>
<div class="relative">
<select class="block w-full rounded-DEFAULT border-surface-dim bg-surface-container-lowest px-md py-sm font-body-base text-body-base text-on-surface focus:border-secondary focus:ring focus:ring-secondary/20 focus:ring-opacity-50 appearance-none" id="ta-select">
<option value="">-- Chọn Trợ giảng --</option>
<option value="1">Nguyễn Văn A</option>
<option value="2">Trần Thị B</option>
<option value="3">Lê Văn C</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-sm text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]">arrow_drop_down</span>
</div>
</div>
</div>
<!-- Date -->
<div>
<label class="block font-label text-label text-on-surface-variant uppercase mb-xs" for="date-select">Ngày giao việc</label>
<div class="relative">
<input class="block w-full rounded-DEFAULT border-surface-dim bg-surface-container-lowest px-md py-sm font-body-base text-body-base text-on-surface focus:border-secondary focus:ring focus:ring-secondary/20 focus:ring-opacity-50" id="date-select" type="date" value="2023-10-27"/>
</div>
</div>
<!-- Branch -->
<div>
<label class="block font-label text-label text-on-surface-variant uppercase mb-xs" for="branch-select">Chi nhánh</label>
<div class="relative">
<select class="block w-full rounded-DEFAULT border-surface-dim bg-surface-container-lowest px-md py-sm font-body-base text-body-base text-on-surface focus:border-secondary focus:ring focus:ring-secondary/20 focus:ring-opacity-50 appearance-none" id="branch-select">
<option value="">-- Chọn Chi nhánh --</option>
<option value="hn">Hà Nội</option>
<option value="hcm">Hồ Chí Minh</option>
<option value="dn">Đà Nẵng</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-sm text-on-surface-variant">
<span class="material-symbols-outlined text-[20px]">arrow_drop_down</span>
</div>
</div>
</div>
</div>
<hr class="border-surface-variant mb-xl"/>
<!-- Dynamic Task List -->
<div class="mb-lg">
<div class="flex justify-between items-center mb-md">
<h2 class="font-h3 text-h3 text-on-surface">Danh sách nhiệm vụ</h2>
</div>
<!-- Task Row 1 -->
<div class="bg-surface border border-surface-dim rounded-lg p-md mb-md relative group transition-all hover:shadow-sm">
<button class="absolute top-sm right-sm text-on-surface-variant hover:text-error transition-colors p-xs rounded-full hover:bg-error-container" title="Xóa">
<span class="material-symbols-outlined text-[20px]">delete</span>
</button>
<div class="grid grid-cols-1 md:grid-cols-12 gap-md pr-xl">
<!-- Group -->
<div class="md:col-span-3">
<label class="block font-label text-label text-on-surface-variant uppercase mb-xs">Nhóm đầu mục</label>
<div class="relative">
<select class="block w-full rounded-DEFAULT border-surface-dim bg-surface-container-lowest px-sm py-[6px] font-body-small text-body-small text-on-surface focus:border-secondary focus:ring focus:ring-secondary/20 appearance-none">
<option value="before">Trước giờ học</option>
<option selected="" value="during">Trong giờ học</option>
<option value="after">Sau giờ học</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-sm text-on-surface-variant">
<span class="material-symbols-outlined text-[18px]">arrow_drop_down</span>
</div>
</div>
</div>
<!-- Content -->
<div class="md:col-span-6">
<label class="block font-label text-label text-on-surface-variant uppercase mb-xs">Nội dung</label>
<textarea class="block w-full rounded-DEFAULT border-surface-dim bg-surface-container-lowest px-sm py-[6px] font-body-small text-body-small text-on-surface focus:border-secondary focus:ring focus:ring-secondary/20 resize-none h-[34px]" placeholder="Nhập nội dung công việc..." rows="1"></textarea>
</div>
<!-- Attach Class Toggle -->
<div class="md:col-span-3 flex items-center pt-md md:pt-0">
<div class="relative inline-block w-10 mr-2 align-middle select-none transition duration-200 ease-in">
<input checked="" class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-2 border-surface-variant appearance-none cursor-pointer transition-colors duration-200 ease-in-out z-10" id="toggle1" name="toggle1" type="checkbox"/>
<label class="toggle-label block overflow-hidden h-5 rounded-full bg-surface-variant cursor-pointer transition-colors duration-200 ease-in-out" for="toggle1"></label>
</div>
<label class="font-body-small text-body-small text-on-surface cursor-pointer select-none" for="toggle1">Gắn lớp?</label>
</div>
</div>
<!-- Class & Session (Conditional) -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-md mt-sm pt-sm border-t border-surface-variant border-dashed" id="class-session-1">
<div>
<label class="block font-label text-label text-on-surface-variant uppercase mb-xs">Lớp học <span class="text-error">*</span></label>
<div class="relative">
<select class="block w-full rounded-DEFAULT border-surface-dim bg-surface-container-lowest px-sm py-[6px] font-body-small text-body-small text-on-surface focus:border-secondary focus:ring focus:ring-secondary/20 appearance-none">
<option value="">Chọn lớp học</option>
<option selected="" value="ielts1">IELTS Foundation - Tối T3/T5</option>
<option value="toeic1">TOEIC 500+ - Chiều T7/CN</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-sm text-on-surface-variant">
<span class="material-symbols-outlined text-[18px]">arrow_drop_down</span>
</div>
</div>
</div>
<div>
<label class="block font-label text-label text-on-surface-variant uppercase mb-xs">Buổi học <span class="text-error">*</span></label>
<div class="relative">
<select class="block w-full rounded-DEFAULT border-surface-dim bg-surface-container-lowest px-sm py-[6px] font-body-small text-body-small text-on-surface focus:border-secondary focus:ring focus:ring-secondary/20 appearance-none">
<option value="">Chọn buổi học</option>
<option selected="" value="b1">Buổi 5 - Listening Practice</option>
<option value="b2">Buổi 6 - Reading Comprehension</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-sm text-on-surface-variant">
<span class="material-symbols-outlined text-[18px]">arrow_drop_down</span>
</div>
</div>
</div>
</div>
</div>
<!-- Task Row 2 -->
<div class="bg-surface border border-surface-dim rounded-lg p-md mb-md relative group transition-all hover:shadow-sm">
<button class="absolute top-sm right-sm text-on-surface-variant hover:text-error transition-colors p-xs rounded-full hover:bg-error-container" title="Xóa">
<span class="material-symbols-outlined text-[20px]">delete</span>
</button>
<div class="grid grid-cols-1 md:grid-cols-12 gap-md pr-xl">
<!-- Group -->
<div class="md:col-span-3">
<label class="block font-label text-label text-on-surface-variant uppercase mb-xs">Nhóm đầu mục</label>
<div class="relative">
<select class="block w-full rounded-DEFAULT border-surface-dim bg-surface-container-lowest px-sm py-[6px] font-body-small text-body-small text-on-surface focus:border-secondary focus:ring focus:ring-secondary/20 appearance-none">
<option selected="" value="before">Trước giờ học</option>
<option value="during">Trong giờ học</option>
<option value="after">Sau giờ học</option>
</select>
<div class="pointer-events-none absolute inset-y-0 right-0 flex items-center px-sm text-on-surface-variant">
<span class="material-symbols-outlined text-[18px]">arrow_drop_down</span>
</div>
</div>
</div>
<!-- Content -->
<div class="md:col-span-6">
<label class="block font-label text-label text-on-surface-variant uppercase mb-xs">Nội dung</label>
<textarea class="block w-full rounded-DEFAULT border-surface-dim bg-surface-container-lowest px-sm py-[6px] font-body-small text-body-small text-on-surface focus:border-secondary focus:ring focus:ring-secondary/20 resize-none h-[34px]" placeholder="Nhập nội dung công việc..." rows="1">Chuẩn bị tài liệu in ấn</textarea>
</div>
<!-- Attach Class Toggle -->
<div class="md:col-span-3 flex items-center pt-md md:pt-0">
<div class="relative inline-block w-10 mr-2 align-middle select-none transition duration-200 ease-in">
<input class="toggle-checkbox absolute block w-5 h-5 rounded-full bg-white border-2 border-surface-variant appearance-none cursor-pointer transition-colors duration-200 ease-in-out z-10" id="toggle2" name="toggle2" type="checkbox"/>
<label class="toggle-label block overflow-hidden h-5 rounded-full bg-surface-variant cursor-pointer transition-colors duration-200 ease-in-out" for="toggle2"></label>
</div>
<label class="font-body-small text-body-small text-on-surface cursor-pointer select-none" for="toggle2">Gắn lớp?</label>
</div>
</div>
</div>
<button class="mt-sm flex items-center justify-center w-full py-sm border-2 border-dashed border-outline-variant rounded-lg text-primary hover:bg-primary-fixed-dim/10 hover:border-primary transition-colors font-body-medium text-body-medium" type="button">
<span class="material-symbols-outlined mr-xs text-[20px]">add</span>
                    Thêm đầu việc
                </button>
</div>
<!-- Footer/Submission -->
<div class="mt-xl pt-lg border-t border-surface-variant flex flex-col items-center">
<button class="bg-primary-container text-on-primary hover:bg-surface-tint transition-colors px-xl py-sm rounded-lg font-body-medium text-body-medium shadow-sm hover:shadow-md w-full md:w-auto min-w-[200px]" type="button">
                    Gửi nhiệm vụ
                </button>
<p class="font-caption text-caption text-on-surface-variant mt-sm text-center">
                    Khuyến nghị gửi trước 15h30 — gửi trễ vẫn được, hệ thống sẽ báo Admin
                </p>
</div>
</div>
</div>
<script>
        // Simple script to toggle visibility of class/session based on checkbox
        document.getElementById('toggle1').addEventListener('change', function() {
            const classSessionRow = document.getElementById('class-session-1');
            if(this.checked) {
                classSessionRow.style.display = 'grid';
            } else {
                classSessionRow.style.display = 'none';
            }
        });
        
        // Setup for dynamically added rows would go here
    </script>
</body></html>
