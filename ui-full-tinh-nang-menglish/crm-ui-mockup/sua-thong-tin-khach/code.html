<!DOCTYPE html>

<html lang="vi"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@100;300;400;500;600;700&amp;family=JetBrains+Mono:wght@400&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-high": "#e3e8f9",
                        "on-primary-fixed": "#360f00",
                        "error": "#ba1a1a",
                        "on-error": "#ffffff",
                        "surface-bright": "#f9f9ff",
                        "on-surface-variant": "#594137",
                        "on-secondary-fixed": "#00105b",
                        "primary": "#a23f00",
                        "inverse-surface": "#2a303d",
                        "primary-fixed-dim": "#ffb595",
                        "inverse-on-surface": "#ecf0ff",
                        "tertiary-container": "#46a917",
                        "on-tertiary-fixed-variant": "#1a5200",
                        "surface-tint": "#a23f00",
                        "on-tertiary-container": "#0e3500",
                        "on-secondary-container": "#faf7ff",
                        "on-surface": "#161c27",
                        "secondary-fixed-dim": "#bac3ff",
                        "on-tertiary": "#ffffff",
                        "on-primary": "#ffffff",
                        "on-primary-fixed-variant": "#7c2e00",
                        "tertiary": "#256d00",
                        "secondary-fixed": "#dee0ff",
                        "on-error-container": "#93000a",
                        "on-secondary": "#ffffff",
                        "surface-container-highest": "#dde2f3",
                        "surface-container-low": "#f1f3ff",
                        "tertiary-fixed": "#93fb65",
                        "on-tertiary-fixed": "#062100",
                        "outline-variant": "#e1bfb2",
                        "on-primary-container": "#521c00",
                        "outline": "#8d7165",
                        "inverse-primary": "#ffb595",
                        "secondary": "#1e43e7",
                        "primary-container": "#f5691a",
                        "on-secondary-fixed-variant": "#002fc9",
                        "error-container": "#ffdad6",
                        "surface-container-lowest": "#ffffff",
                        "primary-fixed": "#ffdbcd",
                        "secondary-container": "#4160ff",
                        "background": "#f9f9ff",
                        "tertiary-fixed-dim": "#78de4b",
                        "surface-dim": "#d4daea",
                        "on-background": "#161c27",
                        "surface-variant": "#dde2f3",
                        "surface": "#f9f9ff",
                        "surface-container": "#e8eeff"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "gutter": "16px",
                        "base": "8px",
                        "md": "16px",
                        "xl": "32px",
                        "xs": "4px",
                        "sm": "8px",
                        "lg": "24px",
                        "sidebar-width": "260px",
                        "header-height": "64px"
                    },
                    "fontFamily": {
                        "h1": ["Be Vietnam Pro"],
                        "body-small": ["Be Vietnam Pro"],
                        "h3": ["Be Vietnam Pro"],
                        "code": ["JetBrains Mono"],
                        "label": ["Be Vietnam Pro"],
                        "caption": ["Be Vietnam Pro"],
                        "h2": ["Be Vietnam Pro"],
                        "body-medium": ["Be Vietnam Pro"],
                        "body-base": ["Be Vietnam Pro"]
                    },
                    "fontSize": {
                        "h1": ["28px", { "lineHeight": "36px", "letterSpacing": "-0.02em", "fontWeight": "700" }],
                        "body-small": ["13px", { "lineHeight": "18px", "fontWeight": "400" }],
                        "h3": ["18px", { "lineHeight": "26px", "fontWeight": "600" }],
                        "code": ["13px", { "lineHeight": "18px", "fontWeight": "400" }],
                        "label": ["11px", { "lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600" }],
                        "caption": ["11px", { "lineHeight": "16px", "fontWeight": "400" }],
                        "h2": ["22px", { "lineHeight": "30px", "letterSpacing": "-0.01em", "fontWeight": "600" }],
                        "body-medium": ["14px", { "lineHeight": "20px", "fontWeight": "500" }],
                        "body-base": ["14px", { "lineHeight": "20px", "fontWeight": "400" }]
                    }
                },
            },
        }
    </script>
<style>
        body { font-family: 'Be Vietnam Pro', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .modal-overlay {
            background-color: rgba(22, 28, 39, 0.4);
            backdrop-filter: blur(4px);
        }
    </style>
</head>
<body class="bg-surface text-on-surface antialiased min-h-screen flex items-center justify-center p-md">
<!-- Modal Backdrop -->
<div class="fixed inset-0 modal-overlay z-40"></div>
<!-- Popup Container (MH7) -->
<div class="relative z-50 w-full max-w-[560px] bg-surface-container-lowest rounded-lg border border-surface-container-highest shadow-[0px_8px_24px_rgba(0,0,0,0.12)] overflow-hidden transition-all duration-300 transform scale-100 opacity-100">
<!-- Header -->
<div class="px-lg py-md flex items-center justify-between border-b border-surface-container-highest bg-surface-container-low">
<div class="flex items-center gap-sm">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">edit_square</span>
<h2 class="font-h2 text-h2 text-on-surface">Sửa thông tin khách</h2>
</div>
<button class="p-xs hover:bg-surface-container-highest rounded-full transition-colors group">
<span class="material-symbols-outlined text-on-surface-variant group-hover:text-on-surface">close</span>
</button>
</div>
<!-- Content Body -->
<form class="p-lg space-y-md">
<!-- Dual Column Row -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<!-- Họ tên -->
<div class="flex flex-col gap-xs">
<label class="font-label text-label text-on-surface-variant uppercase flex items-center gap-1">
                        Họ tên <span class="text-error">*</span>
</label>
<div class="relative">
<input class="w-full px-md py-sm rounded-lg border border-outline-variant bg-surface-container-lowest font-body-base text-on-surface focus:outline-none focus:border-secondary focus:ring-2 focus:ring-secondary/10 transition-all" placeholder="Nhập họ và tên" type="text" value="Nguyễn Minh Anh"/>
</div>
</div>
<!-- Số điện thoại -->
<div class="flex flex-col gap-xs">
<label class="font-label text-label text-on-surface-variant uppercase flex items-center gap-1">
                        Số điện thoại <span class="text-error">*</span>
</label>
<div class="relative">
<input class="w-full px-md py-sm rounded-lg border border-outline-variant bg-surface-container-lowest font-body-base text-on-surface focus:outline-none focus:border-secondary focus:ring-2 focus:ring-secondary/10 transition-all" placeholder="0xxx xxx xxx" type="tel" value="0901 234 567"/>
</div>
</div>
</div>
<!-- Tên phụ huynh -->
<div class="flex flex-col gap-xs">
<label class="font-label text-label text-on-surface-variant uppercase">
                    Tên phụ huynh
                </label>
<div class="relative">
<input class="w-full px-md py-sm rounded-lg border border-outline-variant bg-surface-container-lowest font-body-base text-on-surface focus:outline-none focus:border-secondary focus:ring-2 focus:ring-secondary/10 transition-all" placeholder="Nhập tên phụ huynh (nếu có)" type="text" value="Trần Thị Lan"/>
</div>
</div>
<!-- Dual Column Row (Dropdowns) -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<!-- Nguồn -->
<div class="flex flex-col gap-xs">
<label class="font-label text-label text-on-surface-variant uppercase flex items-center gap-1">
                        Nguồn <span class="text-error">*</span>
</label>
<div class="relative">
<select class="w-full appearance-none px-md py-sm rounded-lg border border-outline-variant bg-surface-container-lowest font-body-base text-on-surface focus:outline-none focus:border-secondary focus:ring-2 focus:ring-secondary/10 transition-all pr-10">
<option value="">Chọn nguồn</option>
<option selected="" value="fb">Facebook Ads</option>
<option value="gg">Google Ads</option>
<option value="ref">Người quen giới thiệu</option>
<option value="walkin">Trực tiếp (Walk-in)</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant">expand_more</span>
</div>
</div>
<!-- Chi nhánh -->
<div class="flex flex-col gap-xs">
<label class="font-label text-label text-on-surface-variant uppercase flex items-center gap-1">
                        Chi nhánh <span class="text-error">*</span>
</label>
<div class="relative">
<select class="w-full appearance-none px-md py-sm rounded-lg border border-outline-variant bg-surface-container-lowest font-body-base text-on-surface focus:outline-none focus:border-secondary focus:ring-2 focus:ring-secondary/10 transition-all pr-10">
<option value="">Chọn chi nhánh</option>
<option selected="" value="main">Cơ sở chính</option>
<option value="cs2">Cơ sở 2 - Quận 1</option>
<option value="cs3">Cơ sở 3 - Quận 7</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 pointer-events-none text-on-surface-variant">expand_more</span>
</div>
<p class="text-label text-on-surface-variant italic mt-1">* Không thể thay đổi nếu học viên đã có lớp</p></div>
</div>
<!-- Footer Actions -->
<div class="pt-lg flex items-center justify-end gap-md">
<button class="px-lg py-sm font-body-medium text-on-surface hover:bg-surface-container-highest rounded-lg transition-all active:scale-95 duration-150 border border-outline-variant" type="button">
                    Hủy
                </button>
<button class="px-xl py-sm font-body-medium bg-primary-container text-white hover:opacity-90 rounded-lg shadow-md hover:shadow-lg transition-all active:scale-95 duration-150 flex items-center gap-sm" type="submit">
<span class="material-symbols-outlined text-[20px]" style="font-variation-settings: 'FILL' 0, 'wght' 500;">save</span>
                    Lưu thay đổi
                </button>
</div>
</form>
<!-- Aesthetic Accent Line -->
<div class="h-1 w-full bg-gradient-to-r from-primary-container to-secondary"></div>
</div>
<!-- Tooltip / Alert Mockup (Hidden by default, used for interaction demo) -->
<div class="fixed bottom-lg right-lg flex items-center gap-sm bg-inverse-surface text-inverse-on-surface px-lg py-sm rounded-lg shadow-xl translate-y-24 opacity-0 transition-all duration-300" id="toast">
<span class="material-symbols-outlined text-tertiary-fixed">check_circle</span>
<span class="font-body-medium">Đã cập nhật thông tin thành công!</span>
</div>
<script>
        // Micro-interaction for the submit button
        const form = document.querySelector('form');
        const toast = document.getElementById('toast');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            // Show toast
            toast.classList.remove('translate-y-24', 'opacity-0');
            toast.classList.add('translate-y-0', 'opacity-100');
            
            // Hide toast after 3s
            setTimeout(() => {
                toast.classList.add('translate-y-24', 'opacity-0');
                toast.classList.remove('translate-y-0', 'opacity-100');
            }, 3000);
        });

        // Close button logic mockup
        const closeBtn = document.querySelector('button.group');
        closeBtn.addEventListener('click', () => {
            const container = document.querySelector('.relative.z-50');
            container.classList.add('scale-95', 'opacity-0');
            setTimeout(() => {
                alert('Popup closed in mock environment.');
                container.classList.remove('scale-95', 'opacity-0');
            }, 300);
        });
    </script>
</body></html>
