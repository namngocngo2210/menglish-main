# Tạm thời: chạy toàn bộ test Laravel khi push nhánh sửa chấm công / điểm danh, so với main (gỡ trước khi merge).
name: Branch tests

on:
  push:
    branches: [claude/project-thread-5ty54c]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ref: [main, branch]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref == 'main' && 'main' || github.sha }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, intl, gd, zip, bcmath
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: cp .env.example .env && php artisan key:generate && touch database/testing.sqlite
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci && npx vite build --ssr
      - run: php artisan test --compact > out.txt 2>&1 || true
      - name: Danh sách test lỗi
        run: |
          sed -i 's/\x1b\[[0-9;]*m//g' out.txt
          cat out.txt
          grep -E '^\s*Tests:' out.txt || true
          grep -E '^\s*(FAILED|ERROR)\s' out.txt | sed 's/\s\+/ /g' | sort | uniq
