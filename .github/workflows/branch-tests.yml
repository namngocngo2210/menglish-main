# Tạm thời: chạy toàn bộ test Laravel khi push nhánh sửa chấm công / điểm danh, so với main (gỡ trước khi merge).
name: Branch tests

on:
  push:
    branches: [claude/project-thread-5ty54c]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        ref: [main, branch]
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref == 'main' && 'main' || github.sha }}
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, intl, gd, zip, bcmath
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: cp .env.example .env && php artisan key:generate && touch database/testing.sqlite
      - run: php artisan test --log-junit junit.xml || true
      - name: Danh sách test lỗi
        run: |
          python3 - <<'EOF'
          import xml.etree.ElementTree as ET
          bad = []
          for case in ET.parse('junit.xml').iter('testcase'):
              for tag in ('failure', 'error'):
                  el = case.find(tag)
                  if el is not None:
                      msg = (el.text or '').strip().splitlines()
                      bad.append(f"FAILCASE {case.get('class')}::{case.get('name')} | {(msg[1] if len(msg) > 1 else (msg[0] if msg else ''))[:220]}")
          print(f"FAILCOUNT {len(bad)}")
          print("\n".join(sorted(bad)))
          EOF
