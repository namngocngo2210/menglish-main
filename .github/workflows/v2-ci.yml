# CI cho hệ thống mới trong v2/ (Go API + React). Chạy khi v2/ hoặc migration Laravel thay đổi; không đụng CI / deploy của Laravel.
name: v2 CI

on:
  pull_request:
    # database/migrations: bảng Laravel đổi thì chạy lại test import-legacy của v2.
    paths: ['v2/**', '.github/workflows/v2-ci.yml', 'database/migrations/**']
  push:
    branches: [main]
    paths: ['v2/**', '.github/workflows/v2-ci.yml']

concurrency:
  group: v2-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/api
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U test" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:8-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      # DB của Laravel (chạy migration thật) để test import-legacy: bảng cũ đổi cột thì test đỏ.
      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: test
          MARIADB_DATABASE: legacy
        ports: ['3306:3306']
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://test:test@localhost:5432/test?sslmode=disable
      TEST_REDIS_URL: redis://localhost:6379/15
      TEST_LEGACY_MYSQL_DSN: root:test@tcp(127.0.0.1:3306)/legacy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: v2/api/go.mod
          cache-dependency-path: v2/api/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - uses: sqlc-dev/setup-sqlc@v4
        with:
          sqlc-version: '1.31.1'
      - name: Code sinh từ SQL không lệch
        run: sqlc diff
      # Danh mục quyền xuất từ config Laravel; lệch thì chạy lại lệnh export (xem catalog/export.php).
      - name: Danh mục quyền khớp config Laravel
        run: php internal/iam/catalog/export.php | diff -u internal/iam/catalog/catalog.json -
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, intl, gd, zip, bcmath
      - name: Migration Laravel lên MariaDB (cho test import-legacy)
        working-directory: .
        env:
          APP_ENV: testing
          DB_CONNECTION: mariadb
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_DATABASE: legacy
          DB_USERNAME: root
          DB_PASSWORD: test
          CACHE_STORE: array
          SESSION_DRIVER: array
          QUEUE_CONNECTION: sync
        run: |
          composer install --no-dev --no-interaction --no-progress --prefer-dist --no-scripts
          APP_KEY="base64:$(openssl rand -base64 32)" php artisan migrate --force
      # -p 1: các gói test dùng chung một database (test migration xóa sạch schema)
      - run: go test -race -p 1 ./...

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: v2/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: v2/web/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm test
      - run: npm run build

  images:
    runs-on: ubuntu-latest
    needs: [api, web]
    steps:
      - uses: actions/checkout@v4
      - name: Build image api
        run: docker build -f v2/deploy/Dockerfile.api --build-arg VERSION=${{ github.sha }} v2
      - name: Build image web
        run: docker build -f v2/deploy/Dockerfile.web v2
      - name: Kiểm compose beta
        run: cp v2/deploy/.env.beta.example v2/deploy/.env.beta && docker compose -f v2/deploy/compose.beta.yml --env-file v2/deploy/.env.beta config -q
