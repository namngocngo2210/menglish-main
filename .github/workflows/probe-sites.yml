name: Probe sites (tạm, chẩn đoán 503)
on:
  push:
    branches: [claude/fix-503-eu1hqx]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for i in $(seq 1 75); do
            line="$(date -u +%H:%M:%S)"
            for u in https://portal.meducation.vn/login https://dungthu.meducation.vn/login https://portal.meducation.vn/robots.txt https://dungthu.meducation.vn/favicon.ico; do
              r=$(curl -s -o /dev/null -w '%{http_code}/%{time_total}' --max-time 30 "$u" || echo ERR)
              line="$line $r"
            done
            echo "$line"
            sleep 2
          done
