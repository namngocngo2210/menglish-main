# Deploy MEnglish lên máy chủ Docker (docs/deploy-docker.md).
#
# Chỉ deploy tay: Actions → Deploy server → Run workflow, chọn staging (mọi nhánh), production (chỉ main)
# hoặc beta (bản thử hệ thống mới trong v2/, mọi nhánh, không có domain công khai; test của v2 chạy ở workflow "v2 CI").
# Push / merge vào main KHÔNG tự deploy.
#
# CI SSH vào máy chủ bằng khóa riêng, bị ép chạy docker/ci-deploy.sh (forced command) với "<môi trường> <sha>";
# máy chủ tự build image từ đúng commit đó, khởi động lại, migrate.
#
# Secrets (Settings → Secrets and variables → Actions):
#   DEPLOY_SSH_KEY       khóa riêng ed25519 của CI
#   DEPLOY_KNOWN_HOSTS   dòng known_hosts của máy chủ (ssh-keyscan -p <port> <host>)
# Variables: DEPLOY_HOST (IP máy chủ), DEPLOY_PORT (cổng SSH), DEPLOY_USER
name: Deploy server

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Môi trường deploy
        type: choice
        options: [staging, production, beta]
        default: staging
      run_tests:
        description: Chạy toàn bộ test trước khi deploy
        type: boolean
        default: true

concurrency:
  group: deploy-${{ inputs.environment }}
  cancel-in-progress: false

env:
  TARGET: ${{ inputs.environment }}

jobs:
  # Production chỉ nhận code từ nhánh main; staging deploy được mọi nhánh (thử nhánh tính năng trước khi merge).
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: Kiểm tra nhánh
        run: |
          echo "Môi trường: $TARGET · nhánh: ${{ github.ref_name }} · commit: ${{ github.sha }}"
          if [ "$TARGET" = "production" ] && [ "${{ github.ref }}" != "refs/heads/main" ]; then
            echo "::error::Production chỉ deploy từ nhánh main (đang chọn ${{ github.ref_name }}). Merge vào main trước, hoặc chọn staging."
            exit 1
          fi

  test:
    needs: guard
    if: ${{ inputs.run_tests && inputs.environment != 'beta' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_sqlite, intl, gd, zip, bcmath
      - run: composer install --no-interaction --no-progress --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan test

  deploy:
    needs: [guard, test]
    if: ${{ always() && needs.guard.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.environment == 'production' && 'https://portal.meducation.vn' || inputs.environment == 'staging' && 'https://dungthu.meducation.vn' || '' }}
    steps:
      - name: Cấu hình SSH
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.DEPLOY_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Deploy trên máy chủ
        run: |
          ssh -i ~/.ssh/deploy_key -p "${{ vars.DEPLOY_PORT }}" -o BatchMode=yes -o ServerAliveInterval=30 \
            "${{ vars.DEPLOY_USER }}@${{ vars.DEPLOY_HOST }}" "$TARGET ${{ github.sha }}"

      - name: Kiểm tra trang đăng nhập
        run: |
          case "$TARGET" in
            production) url=https://portal.meducation.vn/login ;;
            beta)
              echo "V2 beta không có domain công khai; bỏ qua kiểm tra HTTP công khai. beta.sh deploy đã báo lỗi nếu API không khỏe."
              exit 0
              ;;
            *) url=https://dungthu.meducation.vn/login ;;
          esac
          for i in 1 2 3 4 5; do
            status=$(curl -s -o /dev/null -w '%{http_code}' "$url") || true
            echo "Lần $i: HTTP $status"
            [ "$status" = "200" ] && exit 0
            sleep 10
          done
          exit 1
